<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login BESS</title>
</head>
<body>

<!-- 🔐 LOGIN -->
<div id="login">
  <h2>Login</h2>

  <input type="email" id="email" placeholder="Seu email"><br><br>
  <input type="password" id="senha" placeholder="Sua senha"><br><br>

  <button onclick="login()">Entrar</button>

  <p id="status"></p>
</div>

<!-- ⚙️ SISTEMA (ESCONDIDO) -->
<div id="sistema" style="display:none;">
  <h1>Bem-vindo ao sistema BESS ⚡</h1>
  <p>Aqui vai entrar seu dashboard depois</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = window.supabase.createClient(
  'https://rxmfafapkmyvswdeaxgu.supabase.co',
  'sb_publishable_Q0wAaL6_2GrES9DxyFLqSQ_Yy91KZnI'
)

async function login() {
  const email = document.getElementById('email').value
  const senha = document.getElementById('senha').value

  const { data, error } = await supabaseClient
    .from('usuarios')
    .select('*')
    .eq('email', email)
    .single()

  if (error || !data) {
    document.getElementById('status').innerText = "Usuário não encontrado"
    return
  }

  if (data.senha !== senha) {
    document.getElementById('status').innerText = "Senha incorreta"
    return
  }

  if (!data.ativo) {
    document.getElementById('status').innerText = "Acesso expirado"
    return
  }

  // ✅ LOGIN OK → REDIRECIONA
  window.location.href = "dashboard.html"
}
</script>

</body>
</html>
