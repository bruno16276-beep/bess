<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BESS + Supabase</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial;
  background:#f3f2ef;
  margin:0;
}

.box{
  background:white;
  padding:30px;
  border-radius:12px;
  width:350px;
  margin:auto;
  margin-top:80px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

input,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  box-sizing:border-box;
}

button{
  cursor:pointer;
  background:#0f2d13;
  color:white;
  border:none;
  border-radius:6px;
}
</style>
</head>

<body>

<div id="login" class="box">

  <h2>Login</h2>

  <input id="email" type="email" placeholder="email">

  <input id="senha" type="password" placeholder="senha">

  <button id="btnLogin">
    Entrar
  </button>

  <p id="status"></p>

</div>

<div id="app" class="box" style="display:none">

  <h2>Calcular BESS</h2>

  <input id="consumo_ponta" placeholder="Consumo ponta">

  <input id="tarifa_ponta" placeholder="Tarifa">

  <button id="btnCalc">
    Calcular
  </button>

  <h3 id="resultado"></h3>

</div>

<script>

const supabaseClient = window.supabase.createClient(
  'https://rxmfafapkmyvswdeaxgu.supabase.co',
  'sb_publishable_Q0wAaL6_2GrES9DxyFLqSQ_Yy91KZnI'
);

document
  .getElementById('btnLogin')
  .addEventListener('click', login);

document
  .getElementById('btnCalc')
  .addEventListener('click', calcular);

async function login(){

  alert("BOTÃO FUNCIONOU");

  const email = document.getElementById('email').value;

  const senha = document.getElementById('senha').value;

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: senha
    });

  console.log(data);
  console.log(error);

  if(error){

    alert(error.message);

    document.getElementById('status').innerText =
      error.message;

    return;
  }

  alert("LOGIN OK");

  document.getElementById('login').style.display =
    'none';

  document.getElementById('app').style.display =
    'block';
}

async function calcular(){

  const consumo = parseFloat(
    document.getElementById('consumo_ponta').value
  );

  const tarifa = parseFloat(
    document.getElementById('tarifa_ponta').value
  );

  const { data, error } =
    await supabaseClient.rpc('calcular_bess', {
      consumo_ponta: consumo,
      tarifa_ponta: tarifa
    });

  console.log(data);
  console.log(error);

  if(error){

    alert("ERRO RPC");

    return;
  }

  document.getElementById('resultado').innerText =
    "Resultado: R$ " + data;
}

</script>

</body>
</html>
