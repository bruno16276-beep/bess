<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste BESS</title>
</head>
<body>

<h1>Teste de conexão com Supabase</h1>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = window.supabase.createClient(
  'https://rxmfafapkmyvswdeaxgu.supabase.co',
  'sb_publishable_Q0wAaL6_2GrES9DxyFLqSQ_Yy91KZnI'
)

async function testarConexao() {
  const { data, error } = await supabaseClient
    .from('usuarios')
    .select('*')

  console.log('DATA:', data)
  console.log('ERROR:', error)

  if (error) {
    document.body.innerHTML += "<p>Erro ao conectar</p>"
  } else {
    document.body.innerHTML += "<p>Conexão OK</p>"
  }
}

testarConexao()
</script>

</body>
